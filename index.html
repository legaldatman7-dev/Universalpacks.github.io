    /* Rarity-specific animations */
.flying-card.basic {
    animation: basicPop 0.8s ease forwards;
}

.flying-card.rare {
    animation: rarePop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 40px #ff00f2;
}

.flying-card.legendary {
    animation: legendaryPop 1.6s cubic-bezier(0.300, 0.100, 0.100, 3.275) forwards;
    box-shadow: 0 15px 40px rgba(255, 238, 0, 0.8), 0 0 50px #fffb00;
}

/* Animation Keyframes */
@keyframes basicPop {
    0% { transform: translateY(60px) scale(0.4); opacity: 0; }
    70% { transform: translateY(-15px) scale(1.1);}
    100% { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes rarePop {
    0% { transform: translateY(80px) scale(0.3) rotate(-8deg); opacity: 0; }
    50% { transform: translateY(-25px) scale(1.15) rotate(4deg); }
    100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

@keyframes legendaryPop {
    0% { transform: translateY(5px) scale(0.2) rotate(-15deg); opacity: 0; }
    70% { transform: translateY(12px) scale(0.5) rotate(-7200deg); opacity: 0.3; }
    90% { transform: translateY(3px) scale(0) rotate(0deg); opacity: 0.5; }
    100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
}

/* Extra flash for higher rarities */
.flying-card.rare::after,
.flying-card.legendary::after {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    border-radius: 14px;
}

.flying-card.rare.show-flash::after { animation: rareFlash 0.8s forwards; }
.flying-card.legendary.show-flash::after { animation: legendaryFlash 1s forwards; }

@keyframes rareFlash {
    0% { opacity: 0.7; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.4); }
}

@keyframes legendaryFlash {

    50% { opacity: 0.4 }
    100% { opacity: 0; transform: scale(1.6); }

// ==================== SAVE & LOAD ====================
const SAVE_KEY = 'hololivePacksSave_v2';

let collection = {};        // { fullId: count }
let packsOpened = 0;

function saveGame() {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ collection }));
}

function loadGame() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (!saved) return;
    
    try {
        const data = JSON.parse(saved);
        packsOpened = data.packsOpened || 0;
        collection = data.collection || {};
        updateCollectionCount();
    } catch (e) {
        console.error("Save load failed", e);
    }
}

function resetProgress() {
    if (confirm("Delete ALL progress and start over?")) {
        localStorage.removeItem(SAVE_KEY);
        collection = {};
        packsOpened = 0;
        updateCollectionCount();
    }
}

// ==================== CARD LOGIC ====================
const TOTAL_UNIQUE_CARDS = 498;

function getRandomCard() {
    const char = characters[Math.floor(Math.random() * characters.length)];
    const roll = Math.random();
    
    let type = 'basic';
    let image = char.normal;
    let story = char.normalStory || "A mysterious character from another world.";

    if (roll < 0.04) {                    // 4% Legendary
        type = 'legendary';
        image = char.normal;   // Fallback chain
        story = char.legendaryStory || char.rareStory || char.normalStory;
    } 
    else if (roll < 0.18) {               // 14% Rare (18% - 4%)
        type = 'rare';
        image = char.normal;                     // Fallback to normal
        story = char.rareStory || char.normalStory;
    }
    
    const offset = type === 'legendary' ? 200 : type === 'rare' ? 100 : 0;
    const fullId = char.id + offset;
    
    return { ...char, type, image, story, fullId };
}

// ==================== DOM ELEMENTS ====================
const packEl = document.getElementById('pack');
const cardsContainer = document.getElementById('cardsContainer');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
const modalName = document.getElementById('modalName');
const storyEl = document.getElementById('story');
const libraryModal = document.getElementById('libraryModal');
const libraryGrid = document.getElementById('libraryGrid');

let currentCard = null;
let flyingCards = [];

// Load game
loadGame();

// ==================== PACK OPENING ====================
document.getElementById('packArea').addEventListener('click', () => {
    if (packEl.classList.contains('shaking')) return;

    // Clear old flying cards
    flyingCards.forEach(c => c.remove());
    flyingCards = [];

    packEl.classList.add('shaking');

    setTimeout(() => {
        packEl.classList.remove('shaking');
        packEl.classList.add('opening');

        // === CLEAR PREVIOUS CARDS ===
        cardsContainer.innerHTML = '';
        flyingCards.forEach(c => c.remove());
        flyingCards = [];

        // Open new pack
        const newCards = [];
        for (let i = 0; i < 5; i++) {
            const cardData = getRandomCard();
            collection[cardData.fullId] = (collection[cardData.fullId] || 0) + 1;
            newCards.push(cardData);
            saveGame();
        }
            
        // Create two rows: 2 on top, 3 on bottom
        const topRow = document.createElement('div');
        topRow.className = 'card-row';

        const bottomRow = document.createElement('div');
        bottomRow.className = 'card-row';

        newCards.forEach((cardData, i) => {
            const cardEl = document.createElement('div');
            cardEl.className = `flying-card ${cardData.type}`;
            cardEl.innerHTML = `
                <img src="images/${cardData.image}" alt="${cardData.name}">
                <div class="card-name">
                    ${cardData.name}<br>
                    <small>${cardData.type === 'legendary' ? '◆ Legendary' : cardData.type === 'rare' ? '★ Rare' : ''}</small>
                </div>
            `;

            cardEl.style.opacity = '0';
            cardEl.style.transform = 'translateY(400px) scale(0.7)';
            
            if (window.matchMedia('(max-width: 600px)').matches) {
                if (i < 2) {
                    topRow.appendChild(cardEl);
                } else {
                    bottomRow.appendChild(cardEl);
                }
            } else {
                topRow.appendChild(cardEl);
            }

            flyingCards.push(cardEl);

            const delay = 180 + i * 80;

            // Staggered reveal
            setTimeout(() => {
                cardEl.style.transition = 'none';
                // Trigger animation
                cardEl.offsetHeight; // force reflow
                
                if (cardData.type === 'legendary') {
                    cardEl.classList.add('show-flash');
                } else if (cardData.type === 'rare') {
                    cardEl.classList.add('show-flash');
                }
                
                cardEl.style.transition = 'all 0.4s ease';
                cardEl.style.opacity = '1';
                }, delay);
                cardEl.onclick = () => showCard(cardData);
                });

        cardsContainer.appendChild(topRow);
        cardsContainer.appendChild(bottomRow);

        updateCollectionCount();
        saveGame();

        setTimeout(() => packEl.classList.remove('opening'), 1500);
    });
});

function updateCollectionCount() {
    const count = Object.keys(collection).length;
    document.getElementById('collectionCount').textContent = count;
    saveGame();
}

// ==================== MODALS ====================
function showCard(card) {
    currentCard = card;
    modalCard.innerHTML = `<img src="images/${card.image}" alt="${card.name}">`;
    modalName.textContent = `${card.name} — ${card.type.charAt(0).toUpperCase() + card.type.slice(1)}`;
    storyEl.textContent = '';
    modal.style.display = 'flex';
}

function inspectCard() {
    if (!currentCard) return;
    storyEl.textContent = '';
    let i = 0;
    const text = currentCard.story;
    const interval = setInterval(() => {
        if (i < text.length) storyEl.textContent += text[i++];
        else clearInterval(interval);
    }, 35);
}

function closeModal() {
    modal.style.display = 'none';
}

// ==================== LIBRARY ====================
function openLibrary() {
    libraryGrid.innerHTML = '';

    characters.forEach(char => {
        appendLibraryCard(char, 'basic', collection[char.id] || 0);
        appendLibraryCard(char, 'rare', collection[char.id + 100] || 0);
        appendLibraryCard(char, 'legendary', collection[char.id + 200] || 0);
    });

    document.getElementById('libraryProgress').textContent = 
        `(${Object.keys(collection).length} / ${TOTAL_UNIQUE_CARDS})`;
    
    libraryModal.style.display = 'flex';
}

function appendLibraryCard(char, type, count) {
    const offset = type === 'legendary' ? 200 : type === 'rare' ? 100 : 0;
    const fullId = char.id + offset;
    const imageFile = char.normal;

    const div = document.createElement('div');
    div.className = `library-card ${type}`;

    let html = `
        <img src="${count > 0 ? 'images/' + imageFile : 'https://via.placeholder.com/160x225/111111/555555?text=?'}">
        <div class="label">${char.name}<br><small>${type === 'legendary' ? '◆ Legendary' : type === 'rare' ? '★ Rare' : 'Basic'}</small></div>
    `;

    if (count > 0) {
        html += `<div class="count">×${count}</div>`;
    }

    // Crafting button
    if ((type === 'basic' || type === 'rare') && count >= 5) {
        html += `
            <button class="craft-btn" onclick="event.stopImmediatePropagation(); craftCard(${char.id}, '${type}')">
                Craft ↑
            </button>
        `;
    }

    div.innerHTML = html;

    if (count > 0) {
        div.onclick = () => {
            const cardData = {
                ...char,
                type,
                image: imageFile,
                story: type === 'legendary' ? (char.legendaryStory || char.rareStory) : 
                       type === 'rare' ? char.rareStory : char.normalStory
            };
            showCard(cardData);
            closeLibrary();
        };
    }

    libraryGrid.appendChild(div);
}

function craftCard(charId, currentType) {
    const currentOffset = currentType === 'basic' ? 0 : 100;
    const nextOffset = currentType === 'basic' ? 100 : 200;
    const currentFullId = charId + currentOffset;
    const nextFullId = charId + nextOffset;

    if ((collection[currentFullId] || 0) < 5) return alert("Need 5 copies to craft!");

    collection[currentFullId] -= 5;
    if (collection[currentFullId] <= 0) delete collection[currentFullId];

    collection[nextFullId] = (collection[nextFullId] || 0) + 1;

    alert(`✅ Crafted 1 ${currentType === 'basic' ? 'Rare' : 'Legendary'} card!`);
    openLibrary();
    updateCollectionCount();
}

function showCraftingHelp() {
    alert("Crafting Rules:\n\n• 5 Basic → 1 Rare (same character)\n• 5 Rare → 1 Legendary (same character)");
}

function closeLibrary() {
    libraryModal.style.display = 'none';
}

// Keyboard support
document.addEventListener('keydown', e => {
    if (e.key === "Escape") {
        if (libraryModal.style.display === 'flex') closeLibrary();
        else if (modal.style.display === 'flex') closeModal();
    }
});
