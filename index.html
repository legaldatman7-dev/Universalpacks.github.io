<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hololive Arcane Packs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
    :root {
        --accent: #ff66cc;
    }

    body {
        margin: 0; 
        padding: 20px;
        font-family: 'Segoe UI', sans-serif;
        background: #1a0033;
        color: #eee;
        text-align: center;
    }

    h1 { 
        color: #ff99ff; 
        text-shadow: 0 0 20px #ff66cc;
        font-size: 48px;
        margin: 20px 0 10px;
        position: center;
    }

    button {
        padding: 12px 24px; 
        font-size: 18px; 
        background: linear-gradient(#8800cc, #aa00ff);
        color: white;
        border: none; 
        border-radius: 12px; 
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(170, 0, 255, 0.4);
        transition: all 0.3s;
    }

    button:hover {
        background: linear-gradient(#aa00ff, #cc33ff);
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(170, 0, 255, 0.6);
    }

    .pack-area {
      margin: 40px auto;
      width: 180px;
      height: 240px;
      position: relative;
    }
    
    .pack {
      width: 180px; 
      height: 240px;
      background: linear-gradient(135deg, #6600cc, #ff00aa);
      border: 12px solid gold;
      border-radius: 24px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 34px; 
      font-weight: bold; 
      color: white;
      box-shadow: 0 20px 50px rgba(255,0,200,0.7);
      cursor: pointer;
      user-select: none;
      transition: all 0.3s;
      position: 100px;
    }

    .pack:hover, .pack-area:hover {
        transform: scale(0.95);
    }


    @media only screen and (min-width: 1200px) {
        /* Pack */
        .pack-area {
            margin: 20px auto;
            width: 220px;
            height: 340px;
            position: relative;
        }

        .pack {
            width: 220px; 
            height: 300px;
            background: linear-gradient(135deg, #6600cc, #ff00aa);
            border: 12px solid gold;
            border-radius: 24px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 34px; 
            font-weight: bold; 
            color: white;
            box-shadow: 0 20px 50px rgba(255,0,200,0.7);
            cursor: pointer;
            user-select: none;
            transition: all 0.3s;
            position: 100px;
        }
        .card:hover {
            transform: translateY(-15px) scale(1.08);
            box-shadow: 0 15px 40px rgba(255, 255, 0, 0.8), 0 0 35px #fffb00;
        }
    }

    /* Cards */
    .flying-card, .card {
        width: 170px;
        height: 240px;
        border-radius: 14px;
        overflow: hidden;
        background: #111;
        cursor: pointer;
        transition: all 0.4s ease;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        position: relative;
    }

    .flying-card.basic, .card.basic { border: 3px solid #aaaaaa; }
    .flying-card.rare, .card.rare { 
        border: 4px solid #ff00f2;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px #ff00d4;
    }
    .flying-card.legendary, .card.legendary { 
        border: 5px solid #fffb00;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 30px #fbff00;
    }

    .flying-card .image-container,
    .card .image-container {
        width: 100%;
        height: 150px;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .flying-card img,
    .card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 4px;
        box-sizing: border-box;
    }

    .card:hover {
        transform: translateY(-15px) scale(1.08);
        box-shadow: 0 15px 40px rgba(255, 255, 0, 0.8), 0 0 35px #fffb00;
    }

    /* Rarity-specific animations */
.flying-card.basic {
    animation: basicPop 0.8s ease forwards;
}

.flying-card.rare {
    animation: rarePop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 40px #ff00f2;
}

.flying-card.legendary {
    animation: legendaryPop 1.6s cubic-bezier(0.300, 0.100, 0.100, 3.275) forwards;
    box-shadow: 0 15px 40px rgba(255, 238, 0, 0.8), 0 0 50px #fffb00;
}

/* Animation Keyframes */
@keyframes basicPop {
    0% { transform: translateY(60px) scale(0.4); opacity: 0; }
    70% { transform: translateY(-15px) scale(1.1);}
    100% { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes rarePop {
    0% { transform: translateY(80px) scale(0.3) rotate(-8deg); opacity: 0; }
    50% { transform: translateY(-25px) scale(1.15) rotate(4deg); }
    100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

@keyframes legendaryPop {
    0% { transform: translateY(5px) scale(0.2) rotate(-15deg); opacity: 0; }
    70% { transform: translateY(12px) scale(0.5) rotate(-7200deg); opacity: 0.3; }
    90% { transform: translateY(3px) scale(0) rotate(0deg); opacity: 0.5; }
    100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
}

/* Extra flash for higher rarities */
.flying-card.rare::after,
.flying-card.legendary::after {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
    opacity: 0;
    pointer-events: none;
    border-radius: 14px;
}

.flying-card.rare.show-flash::after { animation: rareFlash 0.8s forwards; }
.flying-card.legendary.show-flash::after { animation: legendaryFlash 1s forwards; }

@keyframes rareFlash {
    0% { opacity: 0.7; transform: scale(0.8); }
    100% { opacity: 0; transform: scale(1.4); }
}

@keyframes legendaryFlash {
    0% { opacity: 0.9; transform: scale(0.2); }
    50% { opacity: 0.4 }
    100% { opacity: 0; transform: scale(1.6); }
}

    .card-name {
        position: absolute;
        bottom: 0;
        left: 0; right: 0;
        background: linear-gradient(transparent, rgba(0,0,0,0.92));
        padding: 20px 12px 14px;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

.cards-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin: 0px 20px 60px;
    height: 75%;
}

.card-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    width: 100%;
    max-width: 440px;
}

.flying-card.basic:hover, .card.basic:hover {
    transform: translateY(-150px) scale(1.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px #aaaaaa;
}

.flying-card.rare:hover, .card.rare:hover {
    transform: translateY(-150px) scale(1.08);
    box-shadow: 0 10px 30px rgba(255, 0, 234, 0.7), 0 0 40px #ff00f2;
}

.flying-card.legendary:hover, .card.legendary:hover {
    transform: translateY(-150px) scale(1.08);
    box-shadow: 15px 25px 50px rgba(255, 238, 0, 0.8), 0 0 50px #fffb00;
}

@media only screen and (max-width: 600px) {
    .cards-container {
        gap: 8px;
        min-height: 380px;
    }
    .card-row {
        gap: 12px;
    }
    .card-row:first-child {
        max-width: 310px;   /* 2 cards */
    }
    .flying-card, .card {
        width: 138px;
        height: 195px;
    }
}

@media only screen and (min-width: 1200px) {
    .cards-container {
        flex-wrap: wrap;
        justify-content: center;
        gap: 24px;
    }
    .card-row {
        flex-direction: row;
        gap: 24px;
        max-width: none;
    }
}

    /* Library */
    .library-card {
        width: 160px;
        aspect-ratio: 160 / 225;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
        background: #111;
        transition: 0.3s;
        cursor: pointer;
    }

    .library-card img {
        width: 100%;
        height: 100%;
        max-width: fit-content;
        max-height: fit-content;
        object-fit: contain;
        background: #0a0a0a;
    }

    .library-card .label {
        position: absolute;
        bottom: 0;
        left: 0; right: 0;
        background: linear-gradient(transparent, rgba(0,0,0,0.9));
        padding: 14px 8px 10px;
        font-size: 13px;
        text-align: center;
    }

    .library-card .count {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
        z-index: 10;
    }

    .library-card.basic { border: 2px solid #aaaaaa; }
    .library-card.rare { 
        border: 3px solid #ff00ff; 
        box-shadow: 0 0 20px #ff00ff; 
    }
    .library-card.legendary { 
        border: 4px solid #ffd700; 
        box-shadow: 0 0 25px #ffd700; 
    }

    .library-card:hover {
        transform: scale(1.08);
    }

    /* Modals */
    .modal, .library-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.96);
        z-index: 300;
        align-items: center;
        justify-content: center;
        padding: 15px;
    }

    .modal-content {
        display: flex;
        max-width: 1100px;
        width: 100%;
        max-height: 85vh;
        background: #220033;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(255, 0, 200, 0.5);
        border: 3px solid #ff99ff;
    }

    @media (min-width: 700px) {
        .modal-content {
            flex-direction: row;
            max-width: 1100px;
        }
    }

    @media (min-width: 700px) {
        .modal-card {
            width: 380px;
            max-height: none;
        }
    }

    .modal-card img {
        max-width: 100%;
        max-height: 520px;
        object-fit: contain;
        border-radius: 12px;
    }

    .story-panel {
        flex: 1;
        padding: 30px;
        text-align: left;
        background: #110022;
        overflow-y: auto;
    }

 .library-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.library-content {

    border-radius: 20px;

.sticky-close-btn:hover {

/* Make sure scrolling works nicely */
.library-content::-webkit-scrollbar {
    width: 8px;
}
.library-content::-webkit-scrollbar-thumb {
    background: #ff66cc;
    border-radius: 4px;
}

    .library-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
        margin-top: 20px;
    }

    @media (min-width: 600px) {
        .library-grid {
            grid-template-columns: repeat(6, 1fr); /* 6 columns on tablets and up */
        }
    }

    .craft-btn {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        font-size: 12px;
        background: linear-gradient(#00cc66, #00aa55);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 20;
    }

    .craft-btn:hover { background: linear-gradient(#00ff88, #00cc66); transform: translateX(-50%) scale(1.1);; }

/* Mobile pack adjustments */
@media (max-width: 480px) {
        h1 { font-size: 1.85rem; }
        .pack { font-size: 28px; height: 265px; width: 190px; }
        .pack-area { width: 190px; height: 285px; }
        .flying-card, .card { width: 138px; height: 194px; }
        .card-row { gap: 12px; }
        .cards-container { gap: 12px; min-height: 420px; }
        .card-name { font-size: 12.8px; padding: 11px 6px 8px; }
    }
</style>
</head>
<body>

<div>
    <button onclick="openLibrary()">📚 Library</button>
    <button onclick="resetProgress()" style="background:#cc0000;">Reset Progress</button>
</div>

<h1>Pack Opening</h1>

<div class="pack-area" id="packArea">
    <div class="pack" id="pack">Open Pack</div>
</div>

<div class="cards-container" id="cardsContainer"></div>

<!-- Card Modal -->
<div class="modal" id="modal">
    <div class="modal-content" style="display:flex; max-width:900px;">
        <div id="modalCard" style="padding:20px; text-align:center;"></div>
        <div style="padding:30px; flex:1; text-align:left;">
            <h2 id="modalName"></h2>
            <div id="story"></div>
            <br>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<!-- Library Modal -->
<div class="library-modal" id="libraryModal">
    <div class="library-content">
    <button onclick="closeLibrary()" class="sticky-close-btn">✕ Close</button>
    <h2>📚 Collection <span id="libraryProgress">(0 / 0)</span></h2>
    
    <!-- NEW: Library Filters -->
    <div id="libraryFilters" style="margin: 15px 0 25px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;">
        <div>
            <label style="color:#ff99ff; margin-right:6px; font-weight:600;">Status:</label>
            <select id="statusFilter" onchange="renderLibrary()" style="padding:8px 12px; border-radius:8px; background:#220033; color:#eee; border:1px solid #ff66cc;">
                <option value="all">All Cards</option>
                <option value="unlocked">Unlocked Only</option>
                <option value="missing">Not Unlocked</option>
            </select>
        </div>
        
        <div>
            <label style="color:#ff99ff; margin-right:6px; font-weight:600;">Franchise:</label>
            <select id="franchiseFilter" onchange="renderLibrary()" style="padding:8px 12px; border-radius:8px; background:#220033; color:#eee; border:1px solid #ff66cc;">
                <!-- Populated automatically by JavaScript -->
            </select>
        </div>
        
        <div>
            <label style="color:#ff99ff; margin-right:6px; font-weight:600;">Rarity:</label>
            <select id="rarityFilter" onchange="renderLibrary()" style="padding:8px 12px; border-radius:8px; background:#220033; color:#eee; border:1px solid #ff66cc;">
                <option value="all">All Rarities</option>
                <option value="basic">Basic</option>
                <option value="rare">Rare</option>
                <option value="legendary">Legendary</option>
            </select>
        </div>
        
        <div>
            <label style="color:#ff99ff; margin-right:6px; font-weight:600;">Sort by:</label>
            <select id="sortOrder" onchange="renderLibrary()" style="padding:8px 12px; border-radius:8px; background:#220033; color:#eee; border:1px solid #ff66cc;">
                <option value="id">ID (default)</option>
                <option value="name">Name (A-Z)</option>
            </select>
        </div>
        
        <button onclick="resetLibraryFilters()" style="padding:8px 16px; background:linear-gradient(#cc0000,#ff3333); color:white; border:none; border-radius:8px; cursor:pointer;">Reset Filters</button>
    </div>
    
    <div class="library-grid" id="libraryGrid"></div>
</div>


<script>
let characters = [];   // Will be populated from CSV

async function loadCharactersFromCSV() {
    try {
        // Try 1: Normal fetch (works with local server)
        let response = await fetch('characters.csv');
        if (response.ok) {
            const text = await response.text();
            characters = parseCSV(text);
            console.log(`Loaded ${characters.length} characters from CSV`);
            return true;
        }
    } catch (e) {}

    // Try 2: Direct path (for file:// protocol)
    try {
        const response = await fetch('./characters.csv');
        if (response.ok) {
            const text = await response.text();
            characters = parseCSV(text);
            console.log(`Loaded ${characters.length} characters from CSV`);
            return true;
        }
    } catch (e) {}

    console.error("Failed to load CSV");
    alert("Could not load characters.csv!\n\nMake sure the file is in the same folder as the HTML file.");
    return false;
}

// Simple CSV parser (handles quoted fields with commas)
function parseCSV(csvText) {
    const lines = csvText.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    
    const result = [];
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        // Better parsing for quoted fields
        const values = [];
        let current = '';
        let inQuotes = false;
        
        for (let char of lines[i]) {
            if (char === '"' && !inQuotes) {
                inQuotes = true;
                continue;
            }
            if (char === '"' && inQuotes) {
                inQuotes = false;
                continue;
            }
            if (char === ',' && !inQuotes) {
                values.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }
        values.push(current.trim());
        
        const obj = {};
        headers.forEach((header, index) => {
            let value = values[index] || '';
            // Remove surrounding quotes if present
            if (value.startsWith('"') && value.endsWith('"')) {
                value = value.slice(1, -1);
            }
            obj[header] = value;
        });
        
        // Convert id to number
        obj.id = parseInt(obj.id);
        
        result.push(obj);
    }
    return result;
}

// ==================== FRANCHISE HELPER ====================
function getFranchise(id) {
    const char = characters.find(c => c.id === id);
    return char ? char.franchise || "Other" : "Other";
}

// Call this instead of the old window.load
window.addEventListener('load', async () => {
    await loadCharactersFromCSV();
    updateCollectionCount();
});

// ==================== CARD LOGIC ====================
console.log("Total characters:", characters.length);
console.log("Expected unique:", characters.length * 3);

// Check for duplicate IDs
const idSet = new Set();
characters.forEach(c => {
    if (idSet.has(c.id)) console.warn("Duplicate ID:", c.id, c.name);
    idSet.add(c.id);
});

// ==================== SAVE / LOAD ====================
const SAVE_KEY = 'hololivePacksSave_v4';  // bumped version

let collection = {}; // e.g. { "1_basic": 3, "1_rare": 1, "42_legendary": 5 }

function getCardKey(charId, type) {
    return `${charId}_${type}`;
}

function saveGame() {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ collection }));
}

function loadGame() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
        try {
            collection = JSON.parse(saved).collection || {};
        } catch(e) {}
    }
}

function resetProgress() {
    if (confirm("Delete ALL progress?")) {
        localStorage.removeItem(SAVE_KEY);
        collection = {};
        updateCollectionCount();
        if (document.getElementById('libraryModal').style.display === 'flex') openLibrary();
    }
}

// ==================== CARD GENERATION ====================
function getRandomCard() {
    if (characters.length === 0) {
        console.error("No characters loaded!");
        return null;
    }
    
    const char = characters[Math.floor(Math.random() * characters.length)];
    const roll = Math.random();
    
    let type = 'basic';
    let image = char.basic;
    let story = char.normalStory || "A mysterious character.";

    if (roll < 0.04) {                    // 4% Legendary
        type = 'legendary';
        image = char.legendary || char.rare || char.basic;
        story = char.legendaryStory || char.rareStory || char.normalStory;
    } else if (roll < 0.18) {             // 14% Rare
        type = 'rare';
        image = char.rare || char.basic;
        story = char.rareStory || char.normalStory;
    }

    const key = getCardKey(char.id, type);

    return { 
        ...char, 
        type, 
        image, 
        story, 
        key,
        name: char.name 
    };
}

// ==================== DOM ====================
const packEl = document.getElementById('pack');
const cardsContainer = document.getElementById('cardsContainer');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
const modalName = document.getElementById('modalName');
const storyEl = document.getElementById('story');
const libraryModal = document.getElementById('libraryModal');
const libraryGrid = document.getElementById('libraryGrid');

let currentView = 'main';
let currentCard = null;

// Load on start
loadGame();
updateCollectionCount();

// ==================== PACK OPENING ===================+
document.getElementById('packArea').addEventListener('click', () => {
    if (packEl.classList.contains('shaking')) return;

    packEl.classList.add('shaking');
    
    setTimeout(() => {
        packEl.classList.remove('shaking');
        cardsContainer.innerHTML = '';

        const newCards = [];
        for (let i = 0; i < 5; i++) {
            const cardData = getRandomCard();
            collection[cardData.key] = (collection[cardData.key] || 0) + 1;
            newCards.push(cardData);
        }
        saveGame();
        updateCollectionCount();

        // Display cards
        const row = document.createElement('div');
        row.className = 'card-row';
        
        newCards.forEach((cardData) => {
            const cardEl = document.createElement('div');
            cardEl.className = `flying-card ${cardData.type}`;
            cardEl.innerHTML = `
                <img src="images/${cardData.image}" alt="${cardData.name}">
                <div class="card-name">
                    ${cardData.name}<br>
                    <small>${cardData.type.toUpperCase()}</small>
                </div>
            `;
            cardEl.onclick = () => showCard(cardData);
            row.appendChild(cardEl);
        });

        cardsContainer.appendChild(row);
    }, 400);
});

function updateCollectionCount() {
    let unlocked = 0;
    const total = characters.length * 3;

    characters.forEach(char => {
        ['basic', 'rare', 'legendary'].forEach(type => {
            const key = getCardKey(char.id, type);
            if (collection[key] && collection[key] > 0) {
                unlocked++;
            }
        });
    });

    const remaining = total - unlocked;
    document.getElementById('libraryProgress').textContent = 
        `(${unlocked} / ${total} — ${remaining} left)`;
}

// ==================== MODALS ====================
function showCard(card, fromLibrary = false) {
    currentCard = card;
    
    if (fromLibrary) {
        currentView = 'library';
    } else {
        currentView = 'main';
    }

    modalCard.innerHTML = `<img src="images/${card.image}" style="max-height:420px; border-radius:12px;">`;
    modalName.textContent = `${card.name} — ${card.type.charAt(0).toUpperCase() + card.type.slice(1)}`;
    storyEl.textContent = card.story || "No story available.";
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
    
    // Smart return
    if (currentView === 'library') {
        setTimeout(() => {
            openLibrary();
        }, 300); // small delay for smooth transition
    }
}

// ==================== LIBRARY ====================

// Helper to create a single library card element (avoids code duplication)
function createLibraryCard(char, type) {
    const key = getCardKey(char.id, type);
    const count = collection[key] || 0;
    const div = document.createElement('div');
    div.className = `library-card ${type}`;

    let imageSrc = 'https://via.placeholder.com/150x210/111111/555555?text=?';
    if (count > 0) {
        if (type === 'legendary' && char.legendary) imageSrc = 'images/' + char.legendary;
        else if (type === 'rare' && char.rare) imageSrc = 'images/' + char.rare;
        else imageSrc = 'images/' + char.normal;
    }

    let html = `
        <img src="${imageSrc}">
        <div class="label">${char.name}<br><small>${type.toUpperCase()}</small></div>
        ${count > 0 ? `<div class="count">×${count}</div>` : ''}
    `;

    if (type !== 'legendary' && count >= 5) {
        const targetType = type === 'basic' ? 'Rare' : 'Legendary';
        html += `
            <button class="craft-btn" onclick="event.stopImmediatePropagation(); craftCard(${char.id}, '${type}')">
                Craft ${targetType}
            </button>
        `;
    }

    div.innerHTML = html;

    if (count > 0) {
        div.onclick = (e) => {
            if (e.target.tagName === 'BUTTON') return;
            const cardData = {
                ...char,
                type: type,
                image: type === 'legendary' ? (char.legendary || char.rare || char.normal) :
                       type === 'rare' ? (char.rare || char.normal) : char.normal,
                story: type === 'legendary' ? (char.legendaryStory || char.rareStory || char.normalStory) :
                       type === 'rare' ? (char.rareStory || char.normalStory) : char.normalStory
            };
            showCard(cardData, true);
            closeLibrary();
        };
    }
    return div;
}

// NEW: Main render function with full filtering + sorting
function openLibrary() {
    currentView = 'library';
    if (characters.length === 0) {
        // Still loading? Show a message
        libraryGrid.innerHTML = `<div style="grid-column:1/-1;padding:60px;color:#ff99ff;">Loading characters from Google Sheet...</div>`;
    }
    populateFranchiseFilter();
    renderLibrary();
    libraryModal.style.display = 'flex';
}

function populateFranchiseFilter() {
    const select = document.getElementById('franchiseFilter');
    const franchises = new Set(characters.map(c => getFranchise(c.id)));
    
    select.innerHTML = '<option value="all">All Franchises</option>';
    Array.from(franchises).sort().forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        select.appendChild(opt);
    });
}

function renderLibrary() {
    const statusFilter = document.getElementById('statusFilter').value;
    const franchiseFilter = document.getElementById('franchiseFilter').value;
    const rarityFilter = document.getElementById('rarityFilter').value;
    const sortOrder = document.getElementById('sortOrder').value;

    const grid = document.getElementById('libraryGrid');
    grid.innerHTML = '';

    let filteredChars = characters.filter(char => {
        const charFranchise = getFranchise(char.id);   // ← Fixed here
        
        if (franchiseFilter !== 'all' && charFranchise !== franchiseFilter) 
            return false;
        
        return true;
    });

    // Sorting
    if (sortOrder === 'name') {
        filteredChars.sort((a, b) => a.name.localeCompare(b.name));
    } else {
        filteredChars.sort((a, b) => a.id - b.id);
    }

    filteredChars.forEach(char => {
        ['basic', 'rare', 'legendary'].forEach(type => {
            if (rarityFilter !== 'all' && type !== rarityFilter) return;

            const key = getCardKey(char.id, type);
            const count = collection[key] || 0;
            const isUnlocked = count > 0;

            if (statusFilter === 'unlocked' && !isUnlocked) return;
            if (statusFilter === 'missing' && isUnlocked) return;

            const cardEl = createLibraryCard(char, type);
            grid.appendChild(cardEl);
        });
    });

    if (grid.children.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'grid-column: 1 / -1; padding: 40px 20px; color: #ff99ff; font-size: 1.1rem; text-align:center;';
        empty.innerHTML = `😢 No cards match your filters.`;
        grid.appendChild(empty);
    }
}

// Reset all filters
function resetLibraryFilters() {
    document.getElementById('statusFilter').value = 'all';
    document.getElementById('franchiseFilter').value = 'all';
    document.getElementById('rarityFilter').value = 'all';
    document.getElementById('sortOrder').value = 'id';
    renderLibrary();
}

function closeLibrary() {
    libraryModal.style.display = 'none';
}

// ==================== CRAFTING ====================
function craftCard(charId, fromType) {
    const toType = fromType === 'basic' ? 'rare' : 'legendary';
    const fromKey = getCardKey(charId, fromType);
    const toKey = getCardKey(charId, toType);

    const count = collection[fromKey] || 0;
    if (count < 5) {
        alert(`You need 5 ${fromType} cards to craft a ${toType}!`);
        return;
    }

    if (confirm(`Craft 1 ${toType} using 5 ${fromType} cards?`)) {
        collection[fromKey] -= 5;
        collection[toKey] = (collection[toKey] || 0) + 1;
        saveGame();
        updateCollectionCount();
        renderLibrary();
    }
}

// Escape key support
document.addEventListener('keydown', e => {
    if (e.key === "Escape") {
        if (libraryModal.style.display === 'flex') closeLibrary();
        else if (modal.style.display === 'flex') closeModal();
    }
});
